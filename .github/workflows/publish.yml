name: Publish on GitHub, CurseForge & Modrinth
on: [workflow_dispatch]

env:
  VERSION: 1.0
  RELEASE_NAME: Improved Maps 1.0 for Minecraft 1.21.1
  CHANGE_LOG: |
    - Backport to Minecraft 1.21.1
  CURSEFORGE_TOKEN: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}
  MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}

jobs:
  build:
    uses: "./.github/workflows/build.yml"
  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: Artifacts
      - name: Publish (CurseForge/Modrinth/GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1662987
          curseforge-token: "${{env.CURSEFORGE_TOKEN}}"

          modrinth-id: wRyAdXG3
          modrinth-token: "${{env.MODRINTH_TOKEN}}"
          modrinth-featured: true

          github-tag: "v${{env.VERSION}}+mc1.21.1"
          github-token: "${{env.GITHUB_TOKEN}}"

          name: "${{env.RELEASE_NAME}}"
          version: "${{env.VERSION}}"
          version-type: release
          changelog: "${{env.CHANGE_LOG}}"
          environment: client? | server | singleplayer
          dependencies: |
            fabric-api
            polymer
            modmenu(optional)
            yacl(optional)

          loaders: fabric
          files: |
            !(*-@(dev|sources|javadoc)).jar
            *-@(dev|sources|javadocs).jar
